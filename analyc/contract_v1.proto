syntax = "proto3";

package analyc.v1;

// Otel kontrat PDF okuma servisi.
// Baglanti kopmasi IPTAL DEGILDIR; iptal icin StopExtractContract kullan.
service ContractService {
  // Server streaming: PDF okuma / Gemini cikarma / dogrulama / staging kayit adimlarini bildirir.
  rpc ExtractContract (ExtractContractRequest) returns (stream ContractEvent);

  // Devam eden kontrat okumasini durdurur (analyze_runs hotel_id=-2 aktif kayit).
  rpc StopExtractContract (StopExtractContractRequest) returns (StopExtractContractResponse);
}

// Acente. 0 = rehber yok (genel prompt). ANEX -> anex.md, PEGAS -> pegas.md, TUI -> tui.md,
// ALLTOURS -> alltours.md, DER -> der.md, SEACITY -> seacity.md, SUMMERTOUR -> summertour.md,
// HOTELBEDS -> hotelbeds.md, SUNQUEST -> sunquest.md.
enum Agency {
  AGENCY_UNSPECIFIED = 0;
  ANEX = 1;
  PEGAS = 2;
  TUI = 3;
  ALLTOURS = 4;
  DER = 5;
  SEACITY = 6;
  SUMMERTOUR = 7;
  HOTELBEDS = 8;
  SUNQUEST = 9;
}

message ExtractContractRequest {
  int32 hotel_id = 1;   // HotelInfo.id (opsiyonel; 0 = bilinmiyor)
  string file_name = 2; // orijinal dosya adi (log / rapor icin)
  bytes pdf = 3;        // PDF icerigi
  int32 user_id = 4;    // staging id, zorunlu (0 → INVALID_ARGUMENT)
  Agency agency = 5;    // acente; eslesen md prompt'a eklenir
}

message ContractCheck {
  int32 price_like_total = 1;
  int32 price_like_found = 2;
  repeated string missing = 3;
  repeated string unknown = 4;
  bool suspicious = 5;
}

// phase: started | pdf_reading | pdf_read | extracting | extracted
//        | checked | saving | saved | completed | cancelled | failed
message ContractEvent {
  string phase = 1;
  int32 run_id = 2;
  int32 hotel_id = 3;
  int32 step_index = 4;
  int32 step_total = 5;
  string message = 6;
  string result_json = 7;   // completed / extracted asamasinda JSON string
  ContractCheck check = 8;  // checked / completed asamasinda
  repeated string warnings = 9;  // saved / completed: normalize ve payload uyarilari
}

message StopExtractContractRequest {
  int32 user_id = 1;
}

message StopExtractContractResponse {
  string status = 1;   // stopped | not_running
  string message = 2;
}
